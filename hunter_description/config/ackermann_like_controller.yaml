# ---------------------------------------------------------------------------
# ros2_control configuration for the Hunter (Ackermann) robot - ROS 2 Jazzy.
#
# The robot has TWO steerable front wheels and TWO driven rear wheels, which is
# exactly the kinematic model of ros2_controllers' AckermannSteeringController
# (two steering joints + two traction joints). That controller is used here.
#
# CLEANUP NOTE:
#   The previous version of this file also defined `ackermann_like_controller`
#   (tricycle_controller/TricycleController). The tricycle model assumes ONE
#   steering + ONE drive joint, which does not match this 4-wheel chassis, and
#   nothing in the launch files loaded it. It has been removed to avoid an
#   incorrect, unused controller. JointStateBroadcaster + AckermannSteering
#   are the only controllers actually loaded by the sim/bringup launch files.
# ---------------------------------------------------------------------------
controller_manager:
  ros__parameters:
    update_rate: 50 # Hz
    use_sim_time: true

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    # The front road wheels are passive (no command interface), so the
    # broadcaster must be told to publish their state explicitly.
    extra_joints: ["front_left_wheel_joint", "front_right_wheel_joint"]

ackermann_controller:
  ros__parameters:
    reference_timeout: 2.0
    # front_steering=true: the steered axle is the front one.
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    # position_feedback=false -> traction state is read as velocity (rad/s),
    # which matches the rear wheel <state_interface name="velocity"/> in
    # ros2_control.xacro.
    position_feedback: false

    # Joint name order for 2-steer/2-traction kinematics is [right, left]
    # (per the steering_controllers_library spec). These names match the
    # joints declared in hunter_description/description/ros2_control.xacro.
    traction_joints_names: [rear_right_wheel_joint, rear_left_wheel_joint]
    steering_joints_names: [front_right_steering_joint, front_left_steering_joint]

    # Geometry (metres).
    wheelbase: 0.65              # rear axle <-> front axle distance
    traction_track_width: 0.605  # rear wheel separation
    steering_track_width: 0.605  # front wheel separation
    traction_wheels_radius: 0.165

    # Odometry / TF
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false        # leave odom->base_link TF to robot_localization
    pose_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
